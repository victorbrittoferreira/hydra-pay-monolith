version: "3.9"

services:
  postgres:
    image: postgres:16
    command: postgres -c max_connections=1000 -c shared_buffers=375MB -c synchronous_commit=off
    environment:
      POSTGRES_DB: hydra_monolith
      POSTGRES_USER: hydra
      POSTGRES_PASSWORD: hydra
    ports:
      - "5434:5432"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1.5GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydra -d hydra_monolith"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    environment:
      HYDRA_DB_URL: jdbc:postgresql://postgres:5432/hydra_monolith
      HYDRA_DB_USER: hydra
      HYDRA_DB_PASSWORD: hydra
      SERVER_PORT: 8080
      JAVA_OPTS: "-Xms768m -Xmx768m -XX:+UseG1GC -XX:ActiveProcessorCount=2 -Dspring.threads.virtual.enabled=true"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "400"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1GB
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8080"
    restart: unless-stopped
